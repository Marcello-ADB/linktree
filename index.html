<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pecatto Bar e Restaurante</title>
  <meta name="description" content="Trazendo um novo conceito em parmegiana!">
  <meta property="og:title" content="Pecatto Bar e Restaurante">
  <meta property="og:description" content="Trazendo um novo conceito em parmegiana!">
  <meta name="theme-color" content="#5F1819">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700&display=swap" rel="stylesheet">
  <style>
    /* Theme: change these values to restyle the whole page */
    :root {
      --bg: #5F1819;
      --text: #FFFFFF;
      --button: #E4B59A;
      --button-text: #000000;
    }

    * { box-sizing: border-box; margin: 0; }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font: 500 16px/1.5 Manrope, system-ui, sans-serif;
    }

    main {
      max-width: 580px;
      margin: 0 auto;
      padding: 48px 16px 64px;
      text-align: center;
    }

    .avatar {
      display: grid;
      place-items: center;
      width: 96px;
      height: 96px;
      margin: 0 auto 16px;
      border-radius: 50%;
      background: var(--button);
      color: var(--bg);
      font-size: 48px;
      font-weight: 700;
      object-fit: cover;
    }

    h1 { font-size: 20px; font-weight: 700; }

    .social {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin: 12px 0 32px;
    }

    .social a {
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      color: var(--text);
    }

    .social svg { width: 28px; height: 28px; }

    .links { display: grid; gap: 16px; }

    .links section { display: grid; gap: 12px; margin-bottom: 8px; }

    h2 { font-size: 16px; font-weight: 700; }

    .link {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 56px;
      padding: 12px 60px;
      border-radius: 999px;
      background: var(--button);
      color: var(--button-text);
      text-decoration: none;
      transition: transform 0.15s ease;
    }

    .link svg { position: absolute; left: 20px; width: 24px; height: 24px; }

    .link:hover { transform: scale(1.02); }
    .link:active { transform: scale(0.98); }

    a:focus-visible { outline: 3px solid var(--text); outline-offset: 3px; }

    @media (prefers-reduced-motion: reduce) {
      .link { transition: none; }
    }
  </style>
</head>
<body>
  <main>
    <!-- To use a logo image, replace this div with: <img class="avatar" src="logo.webp" alt=""> -->
    <div class="avatar" aria-hidden="true">P</div>
    <h1>Pecatto Bar e Restaurante</h1>
    <p>Trazendo um novo conceito em parmegiana!</p>

    <nav class="social" aria-label="Redes sociais">

      </a>

        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 7.917v4.034a9.948 9.948 0 0 1 -5 -1.951v4.5a6.5 6.5 0 1 1 -8 -6.326v4.326a2.5 2.5 0 1 0 4 2v-11.5h4.083a6.005 6.005 0 0 0 4.917 4.917z"/></svg>
      </a>
    </nav>

    <div class="links">

          10% mais barato que o iFood

      <a class="link" href="https://wa.me/5511993423524">

      <a class="link" href="https://share.google/a3QNow1HMtiV1chvs">

      <a class="link" href="https://reservation-widget.tagme.com.br/reservation/schedule/669f9fbc8c0b7b968e68e3ab/reservationWidget">

  </main>
</body>
</html>
